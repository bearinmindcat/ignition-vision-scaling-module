name: Build

# Builds the module on every push to main, every pull request, and by hand
# (Actions > Build > Run workflow). The unsigned module is kept as the run's artifact.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: ./gradlew build
      - name: Keep the unsigned module
        uses: actions/upload-artifact@v7
        with:
          name: Vision-Scaling-Fix-unsigned
          path: build/Vision-Scaling-Fix.unsigned.modl
