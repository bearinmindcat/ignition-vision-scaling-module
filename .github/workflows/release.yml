# Release pipeline: pushing a version tag (v0.1.0, v1.2.3, ...) builds the module at that version
# and makes a draft GitHub release named after the tag, with generated notes: fill them in on
# GitHub and publish the draft. It attaches:
#
#   Vision-Scaling-Fix.unsigned.modl   the module; the Gateway needs -Dignition.allowunsignedmodules=true
#
# Ignition only reads numeric versions, so tags are vMAJOR.MINOR.PATCH with no suffix.
#
# A manual run (Actions > Release > Run workflow) is a dry run: it builds the module at the version
# in gradle.properties, keeps it as the run's artifact, and releases nothing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # never cancel a release halfway; a newer push waits its turn
  cancel-in-progress: false

jobs:
  module:
    name: Module
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - id: v
        name: Resolve version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH; Ignition only reads numeric versions."
              exit 1
            fi
          else
            version="$(sed -n 's/^version=//p' gradle.properties)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: ./gradlew build -Pversion="${{ steps.v.outputs.version }}"

      - name: Keep the module (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: Vision-Scaling-Fix-${{ steps.v.outputs.version }}-unsigned
          path: build/Vision-Scaling-Fix.unsigned.modl

      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          build/Vision-Scaling-Fix.unsigned.modl
          --draft
          --title "$GITHUB_REF_NAME"
          --generate-notes
